[metadata]
name = fort-performance-context
version = 0.1.0
description = Leakage-aware modeling prototype for REST handgrip performance context.

[options]
packages = find_namespace:
install_requires =
    numpy>=2.0,<3
    pandas>=2.0,<3
python_requires = >=3.9

[options.packages.find]
include =
    src*

[options.extras_require]
modeling =
    scikit-learn==1.5.2
test =
    pytest>=8,<9
