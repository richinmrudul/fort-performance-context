[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fort-performance-context"
version = "0.1.0"
description = "Leakage-aware modeling prototype for REST handgrip performance context."
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.0,<3",
]

[project.optional-dependencies]
modeling = [
    "scikit-learn==1.5.2",
]
test = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
